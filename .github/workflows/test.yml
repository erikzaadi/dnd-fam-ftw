# Unit, integration and E2E tests.
#
# The workflow always runs so the aggregate "Test result" check reports on every
# change; jobs are skipped when their paths did not change. Shared, root package,
# .nvmrc and workflow/action changes re-test every dependent package.
# Deploy calls this workflow with run_all=true to verify the exact release SHA.

name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      run_all:
        description: Run every job regardless of changed paths
        type: boolean
        default: true

jobs:
  changes:
    if: ${{ !inputs.run_all }}
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.backend == 'true' || steps.filter.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            common: &common
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - '.github/workflows/test.yml'
              - '.github/actions/**'
              - 'packages/**'
            backend:
              - *common
              - 'backend/**'
            frontend:
              - *common
              - 'frontend/**'

  test-backend-unit:
    name: Test Backend Unit
    needs: changes
    if: >-
      always() &&
      (inputs.run_all || needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install and build shared
        run: cd packages/shared && npm ci && npm run build

      - name: Install deps
        run: cd backend && npm ci

      - name: Run tests
        run: cd backend && npm test

  test-backend-integration:
    name: Test Backend Integration
    needs: changes
    if: >-
      always() &&
      (inputs.run_all || needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install and build shared
        run: cd packages/shared && npm ci && npm run build

      - name: Install deps
        run: cd backend && npm ci

      - name: Run integration tests
        run: cd backend && npm run test:integration

  test-frontend:
    name: Test Frontend Unit
    needs: changes
    if: >-
      always() &&
      (inputs.run_all || needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install and build shared
        run: cd packages/shared && npm ci && npm run build

      - name: Install deps
        run: cd frontend && npm ci

      - name: Run tests
        run: cd frontend && npm test

  test-e2e:
    name: Test E2E
    needs: changes
    if: >-
      always() &&
      (inputs.run_all || needs.changes.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-playwright
        with:
          install-command: npm run ci:all && npm run build --prefix packages/shared

      - name: Run e2e tests
        run: cd frontend && npm run test:e2e

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Stable required check for branch protection: always reports, and fails if any
  # job that ran failed or was cancelled. Skipped jobs (unchanged paths) pass.
  result:
    name: Test result
    needs: [changes, test-backend-unit, test-backend-integration, test-frontend, test-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "One or more test jobs failed."
            exit 1
          fi

  notify:
    needs:
      - test-backend-unit
      - test-backend-integration
      - test-frontend
      - test-e2e
    if: >-
      always() && !inputs.run_all &&
      (
        needs.test-backend-unit.result != 'skipped' ||
        needs.test-backend-integration.result != 'skipped' ||
        needs.test-frontend.result != 'skipped' ||
        needs.test-e2e.result != 'skipped'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Determine status
        id: result
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/notify-pushover
        if: steps.result.outputs.status == 'failure'
        with:
          status: ${{ steps.result.outputs.status }}
          token: ${{ secrets.PUSHOVER_TOKEN }}
          user: ${{ secrets.PUSHOVER_USER }}
          title: Test
